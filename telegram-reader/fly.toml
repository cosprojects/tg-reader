# Fly.io: backend Telegram Reader (бот, HTTP API, Silero).
# Запуск из каталога telegram-reader/: fly deploy
app = "tg-reader-backend"
primary_region = "waw"

[build]
  # Контекст сборки — каталог telegram-reader/, поэтому путь до Dockerfile относительный.
  dockerfile = "server/Dockerfile"

[env]
  # Бот принимает апдейты вебхуком: запрос от Telegram и есть то, что будит заснувшую машину.
  BOT_MODE = "webhook"
  PUBLIC_API_BASE = "https://tg-reader-backend.fly.dev"
  # Кэш аудио и voices.json живут на томе: переживают засыпание, холодный старт и деплой.
  AUDIO_CACHE_DIR = "/data/audio"
  TTS_SILERO_DATA_DIR = "/data/silero"
  TTS_AUDIO_COMPRESSOR = "ffmpeg"
  SILERO_THREADS = "2"
  API_PORT = "3001"

[[mounts]]
  source = "audio_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Машина засыпает, когда к ней не приходят запросы, и просыпается на запрос Telegram.
  # Заплачено будет только за время работы: в простое считаются лишь образ и том.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # Одна общая vCPU и 2 ГБ: больше 2 ГБ Fly не рекомендует для сна, а меньше нельзя —
  # синтез части в 795 символов занимает 1.16 ГБ, плюс Node. Пока машина спит, память не считается.
  size = "shared-cpu-1x"
  memory = "2gb"
